name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Headless test gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Run the canonical gate
        run: scripts/test.sh
